name: Motero build, test and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reuse_build_run_id:
        description: 'Optional successful build-job run to reuse after release infrastructure changes only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: motero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check version and existing releases
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          MOTERO_BEFORE: ${{ github.event.before }}
        run: python3 scripts/release_metadata.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reader/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Android SDK packages
        run: |
          python3 - <<'PY'
          import os,shutil,subprocess,sys
          from pathlib import Path
          sdk=shutil.which('sdkmanager')
          if not sdk:
              home=Path(os.environ.get('ANDROID_HOME','/usr/local/lib/android/sdk'))
              candidates=list(home.glob('cmdline-tools/*/bin/sdkmanager'))
              sdk=str(next((p for p in candidates if '/latest/' in str(p)),candidates[0] if candidates else ''))
          if not sdk:
              print('::error title=Android SDK installation::sdkmanager was not found in PATH or ANDROID_HOME/cmdline-tools')
              sys.exit(1)
          for command,input_text in [([sdk,'--licenses'],'y\n'*200),([sdk,'platforms;android-37.0','build-tools;36.0.0'],None)]:
              result=subprocess.run(command,input=input_text,text=True,capture_output=True)
              if result.returncode:
                  detail=(result.stderr+'\n'+result.stdout)[-3000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title=Android SDK installation::'+detail)
                  sys.exit(result.returncode)
              print('SDK command completed: '+' '.join(command[1:]))
          PY
      - name: Use JDK 17 for the Android build
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate runtime assets and restore PDF.js
        run: python3 scripts/prepare_reader_assets.py
      - name: Audit source history and publication guards
        run: |
          mkdir -p qa-ci
          python3 scripts/audit_publication.py --ref HEAD --ref refs/remotes/origin/reader --output qa-ci/publication-audit.json
          python3 -m unittest discover -s scripts/tests -p test_publication_audit.py -v
          python3 -m unittest discover -s scripts/tests -p test_build_reuse.py -v
      - name: Build and test the reader
        shell: bash
        run: |
          mkdir -p qa-ci
          cd reader
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee ../qa-ci/reader-full-tests.log
          npx webpack --config-name android 2>&1 | tee ../qa-ci/reader-build.log
      - name: Package reader and build Android APK
        shell: bash
        run: |
          python3 scripts/package_reader_assets.py
          ./gradlew :app:testDevReleaseUnitTest :app:assembleDevRelease -PmoteroPublicRelease=true --init-script scripts/test_jvm_agent.gradle --no-build-cache --no-daemon --max-workers=4 2>&1 | tee qa-ci/android-build.log
          python3 scripts/collect_test_results.py --directory app/build/test-results/testDevReleaseUnitTest --output qa-ci/native-tests.json
      - name: Check publication refuses missing or development keys
        shell: bash
        env:
          MOTERO_TEST_UNSIGNED_APK: ${{ github.workspace }}/app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk
        run: |
          export MOTERO_TEST_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          python3 -m unittest discover -s scripts/tests -p test_signing_guards.py -v 2>&1 | tee qa-ci/signing-guards.log
          python3 -m unittest discover -s scripts/tests -p test_receiver_permission.py -v 2>&1 | tee qa-ci/receiver-permission.log
      - name: Install isolated browser test tools
        run: npm install --prefix .browser-tools --no-audit --no-fund playwright@1.56.1
      - name: Run browser regressions
        env:
          NODE_PATH: ${{ github.workspace }}/.browser-tools/node_modules
        run: |
          python3 scripts/run_browser_checks.py --browser "$(command -v google-chrome || command -v chromium)" --output qa-ci
      - name: Prepare release artifacts
        run: |
          python3 scripts/prepare_release.py --unsigned-ci --apk app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk --output dist
          python3 scripts/audit_publication.py --ref HEAD --archive dist/Motero_Build${{ steps.meta.outputs.version_code }}_Source.zip --archive dist/Motero_Build${{ steps.meta.outputs.version_code }}-unsigned.apk --output qa-ci/release-source-audit.json
          python3 - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          shutil.make_archive('dist/Motero_TestReports','zip','qa-ci')
          files=sorted(p for p in Path('dist').iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: motero-unsigned-build-${{ steps.meta.outputs.version_code }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize build failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('qa-ci').glob('*.log'):
              text=path.read_text(errors='replace')
              if any(marker in text for marker in ['FAILED','FAIL','AssertionError','Error:','error:']):
                  detail=text[-3000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title='+path.name+'::'+detail)
          PY
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-reports
          path: |
            qa-ci/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && ((needs.build.result == 'success' && needs.build.outputs.publish == 'true') || (github.event_name == 'workflow_dispatch' && inputs.reuse_build_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Read current release version
        id: release_meta
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          metadata=json.loads(subprocess.check_output(['python3','scripts/prepare_release.py','--metadata-only'],text=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,value in metadata.items(): output.write(f'{key}={value}\n')
          PY
      - name: Require private production signing
        env:
          MOTERO_RELEASE_SIGNING: ${{ secrets.MOTERO_RELEASE_SIGNING }}
        run: |
          if [ -z "$MOTERO_RELEASE_SIGNING" ]; then
            echo '::error::Add repository Actions secret MOTERO_RELEASE_SIGNING using your private signing backup. No APK will be published with the public development key.'
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator host libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libxcb-cursor0 libxkbcommon-x11-0 libx11-xcb1 libvulkan1
      - name: Locate release verification tools
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager_path" 'build-tools;36.0.0' 'platforms;android-37.0' 'emulator' 'system-images;android-31;default;x86_64' 'system-images;android-35;default;x86_64'
      - name: Download current build
        if: inputs.reuse_build_run_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: motero-unsigned-build-${{ steps.release_meta.outputs.version_code }}
          path: dist
      - name: Download previously tested build
        if: inputs.reuse_build_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: motero-unsigned-build-${{ steps.release_meta.outputs.version_code }}
          path: dist
          run-id: ${{ inputs.reuse_build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify unchanged application inputs and rebuild source package
        if: inputs.reuse_build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
        run: |
          python3 scripts/reuse_tested_build.py --run-id "$BUILD_RUN_ID" --repository "$GITHUB_REPOSITORY" --directory dist
          python3 -m unittest discover -s scripts/tests -p test_build_reuse.py -v
          python3 scripts/audit_publication.py --ref HEAD --ref refs/remotes/origin/reader --archive "dist/Motero_Build${VERSION_CODE}_Source.zip" --output dist/Motero_ReusedSourceAudit.json
      - name: Sign and verify the public release
        env:
          MOTERO_RELEASE_SIGNING: ${{ secrets.MOTERO_RELEASE_SIGNING }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
        run: |
          python3 scripts/sign_release.py --apk "dist/Motero_Build${VERSION_CODE}-unsigned.apk" --output "dist/Motero_Build${VERSION_CODE}.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Verify Android update and data preservation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
        shell: bash
        run: |
          python3 scripts/create_update_probes.py --build-tools "$ANDROID_HOME/build-tools/36.0.0" --output app/build/update-probes
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/713064622" > app/build/update-probes/OriginalBuild303.apk
          gh release download v1.0.0-306 --pattern Motero_Build306.apk --dir app/build/update-probes
          gh release download v1.0.0-315 --pattern Motero_Build315.apk --dir app/build/update-probes
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={'Motero_Build315.apk':'9ff51d3cf40791e98a021cddd23286a61123d013f60dac8e0d4142c932ba62cf', 'OriginalBuild303.apk':'16ea5d9837c89f3121031077e403ade58cf7f9cad557593abcc8d7e5dfb4edfa', 'Motero_Build306.apk':'8d49d8dd599ce6d611e0c43dafb4bf3a04357cef38d9ba5b45f8d3e0a240eb3b'}
          for name,digest in expected.items():
              assert hashlib.sha256((Path('app/build/update-probes')/name).read_bytes()).hexdigest()==digest,name
          PY
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          export ANDROID_AVD_HOME="$RUNNER_TEMP/motero-avd"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['ANDROID_AVD_HOME'])
          root.mkdir(parents=True,exist_ok=True)
          for api in ['31','35']:
              name='motero-update-'+api
              directory=root/(name+'.avd')
              directory.mkdir(exist_ok=True)
              image=Path(os.environ['ANDROID_HOME'])/('system-images/android-'+api+'/default/x86_64')
              assert (image/'source.properties').is_file(),str(image)
              (root/(name+'.ini')).write_text('avd.ini.encoding=UTF-8\npath='+str(directory)+'\ntarget=android-'+api+'\n')
              settings={'AvdId':name,'avd.ini.encoding':'UTF-8','abi.type':'x86_64','hw.cpu.arch':'x86_64','hw.cpu.ncore':'2','hw.ramSize':'2048','hw.keyboard':'yes','hw.lcd.density':'160','hw.lcd.width':'480','hw.lcd.height':'800','hw.gpu.enabled':'yes','hw.gpu.mode':'swiftshader_indirect','hw.mainKeys':'no','disk.dataPartition.size':'2G','tag.id':'default','tag.display':'Default','PlayStore.enabled':'false','image.sysdir.1':str(image)+'/'}
              (directory/'config.ini').write_text(''.join(k+'='+v+'\n' for k,v in settings.items()))
          PY
          accel=on
          if ! "$ANDROID_HOME/emulator/emulator" -accel-check; then accel=off; fi
          for api in 31 35; do
            if [ "$api" = 31 ]; then serial=emulator-5554; port=5554; else serial=emulator-5556; port=5556; fi
            "$ANDROID_HOME/emulator/emulator" -avd "motero-update-$api" -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel "$accel" -skin 480x800 -dpi-device 160 -memory 2048 -cores 2 -port "$port" -feature -Vulkan > "$RUNNER_TEMP/motero-emulator-$api.log" 2>&1 &
            emulator_pid=$!
            trap '"$ANDROID_HOME/platform-tools/adb" -s "$serial" emu kill || true' EXIT
            python3 scripts/check_android_update.py --adb "$ANDROID_HOME/platform-tools/adb" --serial "$serial" --boot-timeout 900 --emulator-pid "$emulator_pid" --emulator-log "$RUNNER_TEMP/motero-emulator-$api.log" --baseline-apk app/build/update-probes/OriginalBuild303.apk --current-baseline-apk app/build/update-probes/Motero_Build315.apk --candidate-apk "dist/Motero_Build${VERSION_CODE}.apk" --rejected-apk app/build/update-probes/Motero_Build306.apk --rollback-probe-apk app/build/update-probes/RejectedOldKey9999.apk --legacy-client-apk app/build/update-probes/UntrustedLegacyClient.apk --output "dist/Motero_UpdateVerification_API${api}.json"
            "$ANDROID_HOME/platform-tools/adb" -s "$serial" emu kill
          done
      - name: Finalize verified release files
        run: |
          python3 scripts/finalize_release.py --directory dist --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Upload emulator diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-update-test-log
          path: ${{ runner.temp }}/motero-emulator-*.log
          if-no-files-found: ignore
      - name: Recheck immutable version and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.release_title }}
        run: |
          python3 scripts/release_metadata.py
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file dist/RELEASE_NOTES.md --latest
