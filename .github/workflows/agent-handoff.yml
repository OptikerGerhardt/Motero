name: Agent handoff dispatcher

# Privileged event path runs only trusted default-branch code, never PR-head code.
# The unprivileged pull_request job tests the pure state machine.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/agent-handoff.yml'
      - '.github/scripts/agent-handoff-core.cjs'
      - '.github/scripts/agent-handoff.test.cjs'
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [develop, 'feature/**']
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-dispatcher-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate handoff transitions (unprivileged)
        run: node --test .github/scripts/agent-handoff.test.cjs

  reconcile:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted default-branch dispatcher only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile trusted, SHA-specific PR status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {AGENT_LABELS, decide} = require('./.github/scripts/agent-handoff-core.cjs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const pull_number = context.payload.pull_request?.number || context.payload.issue?.number;
            if (!pull_number) return;
            const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number});
            const labels = pr.labels.map(x => x.name);
            const target = decide({
              eventName: context.eventName, action: context.payload.action,
              owner, actor: context.payload.sender?.login,
              commentAuthor: context.payload.comment?.user?.login,
              commentBody: context.payload.comment?.body,
              headRepo: pr.head.repo?.full_name, repoFullName: owner + '/' + repo,
              headSha: pr.head.sha, baseRef: pr.base.ref, prState: pr.state,
              labels, baseChanged: Boolean(context.payload.changes?.base?.ref)
            });
            if (!target) return;
            const colors = {'agent:in-progress':'1d76db','agent:needs-review':'fbca04',
              'agent:needs-fix':'d73a4a','agent:review-passed':'0e8a16',
              'agent:ready-for-human-review':'7057ff','agent:blocked':'b60205'};
            try {
              await github.rest.issues.getLabel({owner,repo,name:target});
            } catch (e) {
              if (e.status !== 404) throw e;
              try {
                await github.rest.issues.createLabel({owner,repo,name:target,color:colors[target],
                  description:'Machine-readable multi-agent PR phase'});
              } catch (race) {
                if (race.status !== 422) throw race;
              }
            }
            await github.rest.issues.addLabels({owner,repo,issue_number:pull_number,labels:[target]});
            for (const name of labels.filter(x => AGENT_LABELS.includes(x) && x !== target)) {
              try {
                await github.rest.issues.removeLabel({owner,repo,issue_number:pull_number,name});
              } catch (e) { if (e.status !== 404) throw e; }
            }
            core.info('PR #' + pull_number + ' status -> ' + target + ' (SHA ' + pr.head.sha + ')');
