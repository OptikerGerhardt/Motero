name: Agent handoff dispatcher

# All mutations are labels only. Never checks out or executes PR code.
# issue_comment requires this workflow to be on the DEFAULT branch (main).
# PR-side synchronization is tested on develop first; promotion to main is human-only.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [develop, 'feature/**']
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: agent-handoff-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
      || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile trusted PR handoff
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const names = ['in-progress', 'needs-review', 'needs-fix',
                           'review-passed', 'ready-for-human-review', 'blocked'];
            const agentLabels = names.map(x => 'agent:' + x);
            const pull_number = context.payload.pull_request?.number || context.payload.issue?.number;
            if (!pull_number) return;
            const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number});
            // Never label external forks or PRs targeting main.
            if (pr.state !== 'open' || pr.base.ref === 'main' ||
                !pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) return;
            if (!(pr.base.ref === 'develop' || pr.base.ref.startsWith('feature/'))) return;

            const current = pr.labels.map(x => x.name).filter(x => agentLabels.includes(x));
            let target = null;
            if (context.eventName === 'issue_comment') {
              const c = context.payload.comment;
              // GitHub login is verified, not the comment's author_association text.
              if (context.payload.sender?.login !== owner || c?.user?.login !== owner) return;
              const m = c.body.match(/<!--\s*agent-handoff:v1\s+state=(in-progress|needs-review|needs-fix|review-passed|ready-for-human-review|blocked)\s+sha=([0-9a-f]{40})\s*-->/);
              if (!m || m[2] !== pr.head.sha) return;
              target = 'agent:' + m[1];
              const allowed = {
                'agent:in-progress': ['agent:needs-review','agent:needs-fix','agent:blocked'],
                'agent:needs-review': ['agent:needs-fix','agent:review-passed','agent:blocked'],
                'agent:needs-fix': ['agent:needs-review','agent:blocked'],
                'agent:review-passed': ['agent:ready-for-human-review','agent:needs-fix'],
                'agent:ready-for-human-review': ['agent:needs-fix'],
                'agent:blocked': ['agent:in-progress','agent:needs-review'],
                '(none)': ['agent:in-progress','agent:needs-fix','agent:blocked']
              };
              const from = current.length === 1 ? current[0] : '(none)';
              if (from === target) return;
              if (!(allowed[from] || []).includes(target)) {
                core.info(`Refused transition ${from} -> ${target} for #${pull_number}`);
                return;
              }
              // The marker only transfers responsibility. It never approves/merges code.
              core.info(`Trusted handoff: ${from} -> ${target}, SHA ${pr.head.sha}`);
            } else if (context.eventName === 'pull_request_target') {
              if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
                if (!current.length) target = 'agent:in-progress';
              } else if (context.payload.action === 'synchronize' || context.payload.action === 'edited') {
                // A new HEAD or changed base invalidates previous approval, but does not
                // discard an active needs-fix handoff or pretend new CI was run.
                if (current.includes('agent:review-passed') ||
                    current.includes('agent:ready-for-human-review') ||
                    current.includes('agent:needs-review')) target = 'agent:in-progress';
              }
            }
            if (!target) return;
            const colors = {'agent:in-progress':'1d76db','agent:needs-review':'fbca04',
              'agent:needs-fix':'d73a4a','agent:review-passed':'0e8a16',
              'agent:ready-for-human-review':'7057ff','agent:blocked':'b60205'};
            try {
              await github.rest.issues.getLabel({owner,repo,name:target});
            } catch (e) {
              if (e.status !== 404) throw e;
              try {
                await github.rest.issues.createLabel({owner,repo,name:target,color:colors[target],
                  description:'Handoff state for controlled multi-agent development'});
              } catch (race) {
                if (race.status !== 422) throw race;
              }
            }
            await github.rest.issues.addLabels({owner,repo,issue_number:pull_number,labels:[target]});
            for (const name of current) if (name !== target) {
              try { await github.rest.issues.removeLabel({owner,repo,issue_number:pull_number,name}); }
              catch (e) { if (e.status !== 404) throw e; }
            }
            core.info(`PR #${pull_number}: ${target}`);
