name: Agent queue watchdog

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/agent-queue.yml'
      - '.github/scripts/agent-queue*'
      - '.github/scripts/agent-handoff-core.cjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report overdue handoffs without updating labels
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-queue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test agent queue policy
        run: node --test .github/scripts/agent-queue.test.cjs

  monitor:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { monitor } = require('./.github/scripts/agent-queue.cjs');
            await monitor({ github, context, core, dryRun: context.payload.inputs?.dry_run === 'true' });
